# Automatisering "Airco's uit bij overbelasting fase 3"
#
# Zet alle drie de Daikin-airco's (Onecta-integratie) uit zodra fase 3
# boven 5250 W komt.
#
# Gebruikt climate.set_hvac_mode (hvac_mode: "off") in plaats van
# climate.turn_off: deze Daikin Onecta-entiteiten ondersteunen de
# generieke turn_off/turn_on-acties niet (bevestigd doordat ze niet als
# geldig doel verschijnen bij die acties in Ontwikkelaarstools -> Acties),
# maar set_hvac_mode werkt wel.
#
# BEKENDE BEPERKING: de Daikin Onecta-cloudintegratie reageert soms traag
# (tot ruim een minuut) of lijkt een los commando af en toe te negeren.
# Dit is bevestigd door handmatig testen: hetzelfde commando werkte de
# ene keer meteen, de andere keer pas na een paar herhaalde pogingen. Dit
# ligt bij Daikin's cloud, niet in deze automatisering - Home Assistant
# rondt de automatisering zelf direct af (zichtbaar aan identieke
# tijdstempels in de trace en een vrijwel meteen ontvangen pushmelding).
#
# De Daikin Onecta-cloud-API heeft een streng dagelijks quotum per
# gateway (zie de sensor "Resterend per dag"), doorgaans 200 aanroepen
# per dag. Agressief herhalen (bijv. 5 pogingen x 3 airco's = tot 15
# aanroepen per gebeurtenis) zou dat quotum op een drukke dag flink
# kunnen aanspreken, met als risico dat de bescherming later op de dag
# juist NIET meer werkt omdat het quotum op is - precies averechts voor
# een veiligheidsfunctie. Daarom is dit bewust beperkt tot 2 pogingen:
# direct bij het triggeren, en één herhaling na 45 seconden. Dat vangt
# een eenmalig genegeerd/traag commando op zonder het quotum zwaar te
# belasten. Altijd naar alle drie de airco's, ongeacht bekende status:
# de laatst bekende status in HA kan zelf ook verouderd zijn, dus wachten
# op een 'aan'-status voordat er (opnieuw) uitgeschakeld wordt zou een
# airco kunnen missen. Voor een garantie die niet van het Daikin-quotum
# of de cloud-snelheid afhangt is een lokale (Zigbee/Z-Wave) noodstekker
# per airco de enige echt waterdichte oplossing - dat is een aparte,
# grotere stap (extra hardware) die nog niet is doorgevoerd.
#
# De laatst bekende status (en hvac-modus) op het moment van triggeren
# wordt gebruikt om te bepalen welke airco's straks door de hervat-
# automatisering (airco-weer-aan-na-overbelasting-fase3.yaml) weer
# aangezet mogen worden, en in welke modus. Alleen airco's die op dat
# moment bekend stonden als 'aan' (niet 'off'/'unavailable'/'unknown')
# komen in de helper terecht, samen met hun modus op dat moment (bijv.
# heat_cool, fan_only). Zo wordt nooit een airco aangezet die om een
# andere reden al uit stond.
#
# Bij herhaalde triggers (overbelasting duurt voort, of komt kort na
# elkaar terug) worden nieuwe airco's toegevoegd aan wat al was
# opgeslagen, zonder de eerder opgeslagen modus van een airco te
# overschrijven (dus altijd de modus van vóór de EERSTE uitschakeling in
# deze cyclus).
#
# Opslagformaat in de helper: kommagescheiden "entity_id=modus"-paren,
# bijv. "climate.daikinap46344_room_temperature=heat_cool".
#
# Vereiste helper (Instellingen -> Apparaten en diensten -> Helpers ->
# Toevoegen -> Tekst): input_text.airco_overload_uitgezet, maximale lengte
# 255.
#
# Documentatiekopie - de echte automatisering staat in Home Assistant
# zelf (automations.yaml of via de UI aangemaakt).

alias: Airco's uit bij overbelasting fase 3
description: >-
  Zet alle Daikin-airco's uit (via set_hvac_mode, met retries tegen trage/genegeerde
  cloud-aanroepen) zodra fase 3 boven 5250 W komt, en onthoudt welke + in welke modus
mode: single
triggers:
  - trigger: numeric_state
    entity_id: sensor.p1_meter_vermogen_fase_3
    above: 5250
    for:
      seconds: 5
actions:
  - variables:
      aircos:
        - climate.daikinap46344_room_temperature
        - climate.daikinap86096_room_temperature
        - climate.daikinap86208_room_temperature
      aircos_aan: >-
        {{ aircos | reject('is_state', 'off') | reject('is_state', 'unavailable')
        | reject('is_state', 'unknown') | list }}
      al_opgeslagen: >-
        {{ (states('input_text.airco_overload_uitgezet') | default('', true)).split(',') | select | list }}
      bekende_entiteiten: >-
        {{ al_opgeslagen | map('regex_replace', '=.*$', '') | list }}
  - repeat:
      count: 2
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.index > 1 }}"
          then:
            - delay:
                seconds: 45
        - action: climate.set_hvac_mode
          continue_on_error: true
          target:
            entity_id: "{{ aircos }}"
          data:
            hvac_mode: "off"
  - action: input_text.set_value
    target:
      entity_id: input_text.airco_overload_uitgezet
    data:
      value: >-
        {%- set ns = namespace(pairs=al_opgeslagen) -%}
        {%- for e in aircos_aan -%}
          {%- if e not in bekende_entiteiten -%}
            {%- set ns.pairs = ns.pairs + [e ~ '=' ~ states(e)] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.pairs | join(',') }}
  - action: notify.mobile_app_samsung_s23
    data:
      title: Airco's uitgezet
      message: >-
        Fase 3 kwam boven 5250 W ({{ states('sensor.p1_meter_vermogen_fase_3') }} W).
        Uit-signaal (max. 2 pogingen) gestuurd naar alle {{ aircos | length }} airco's
        ({{ aircos_aan | length }} stonden bekend als 'aan').
