# Automatisering "Airco woonkamer uitzetten bij overbelasting"
#
# Zet de airco in de woonkamer uit zodra sensor.p1_meter_vermogen_fase_3
# boven 5000 W komt.
#
# Onderdeel van een set van drie losse automatiseringen (woonkamer,
# slaapkamer Christian, slaapkamer Jason) die de oudere, gecombineerde
# automatisering airco-uit-bij-overbelasting-fase3.yaml vervangen. Elke
# airco heeft nu zijn eigen automatisering met dezelfde trigger, maar
# volledig losse acties - zo houdt een trage of al-uitstaande unit de
# andere twee niet op.
#
# BELANGRIJKE FIX t.o.v. eerdere versies: het uit-commando werd eerst
# direct na het triggeren verstuurd, zonder de status van de Daikin
# Onecta-cloud te verversen. Herhaald handmatig testen wees uit dat het
# uit-commando dan vaak niet aankwam - de integratie lijkt het commando
# op te bouwen op basis van de laatst bekende (gecachte) status, en die
# kan verouderd zijn. Deze automatisering drukt daarom eerst op de
# refresh-knop van deze Daikin-unit, en wacht (met een timeout van 30
# seconden als vangnet, via continue_on_timeout) tot de last_updated van
# de climate-entiteit daadwerkelijk verandert, voordat het uit-commando
# wordt verstuurd.
#
# INCIDENT EN FIX (25 september 2026): de trigger-target combineerde
# eerder area_id: meterkast met de specifieke entity_id
# sensor.p1_meter_vermogen_fase_3. In Home Assistant is de combinatie van
# area_id en entity_id in een target een UNIE, geen beperking - de
# trigger reageerde daardoor op ALLE vermogensensoren in het gebied
# "meterkast" (waaronder sensor.p1_meter_vermogen, het totaalvermogen
# over alle fasen samen), niet uitsluitend op sensor.p1_meter_vermogen_fase_3
# zoals bedoeld. Hierdoor schakelde Christians airco op 25 september 2026
# onterecht uit bij een totaalverbruik van 5699 W, terwijl fase 3 zelf op
# dat moment nog geen 4000 W trok. Fix: area_id is verwijderd uit de
# trigger-target; alleen de specifieke entity_id blijft over. Toegepast
# bij alle drie de automatiseringen (woonkamer, Christian, Jason).
#
# UPDATE (1 oktober 2026): een vergelijkbare automatisering op fase 2
# (vaatwasser) schakelde terecht af bij een echte maar zeer kortstondige
# piek (3384 W -> 5335 W binnen 5 seconden, bevestigd via de HA-trace -
# geen bug ditmaal, gewoon een korte piek die niet eens in de per-minuut
# Supabase-log terugkwam). Om deze airco niet onnodig op zulke korte
# pieken te laten reageren is een ontdendering toegevoegd: de actiereeks
# wacht nu eerst 5 seconden en herbevestigt dan dat fase 3 nog steeds
# boven 5000 W staat, voordat er iets gebeurt (power.changed ondersteunt
# geen native for:, vandaar deze delay+conditie-aanpak). Verder wordt elke
# daadwerkelijke afschakeling nu gelogd in de nieuwe Supabase-tabel
# overload_event_log, met de watt-waarde op het moment dat de
# ontdendering bevestigde dat het geen korte piek was.
#
# Er is GEEN automatisch herstel meer na afloop van de overbelasting - de
# airco wordt handmatig weer aangezet zodra dat weer veilig is. De
# eerdere hervat-automatisering (airco-weer-aan-na-overbelasting-fase3.yaml)
# en de bijbehorende helper (input_text.airco_overload_uitgezet) zijn
# hiermee vervallen en niet meer nodig.
#
# UPDATE (1 oktober 2026, later): de overbelastingsgrens is sinds app-versie
# 3.70 instelbaar IN DE V3L-APP in plaats van hier vastgelegd. De trigger
# hieronder reageert daarom op een vaste, lage bodemwaarde (4000 W, de
# laagste waarde die in de app te kiezen is) zodat hij altijd op tijd
# afgaat; de conditie hieronder vergelijkt de actuele waarde met de echte -
# door de gebruiker gekozen - grens in de helper input_number.p1_overload_w,
# die wordt bijgewerkt door automations/instellingen-uit-supabase.yaml. Zie
# app/CHANGELOG.md 3.70.
#
# Getest en werkend bevonden (23 september 2026); trigger-target-fix
# toegepast 25 september 2026; ontdendering + logging toegevoegd 1
# oktober 2026; dynamische drempel toegevoegd 1 oktober 2026 (later).
#
# Documentatiekopie - de echte automatisering staat in Home Assistant zelf.

alias: Airco woonkamer uitzetten bij overbelasting
description: ''
triggers:
  - trigger: power.changed
    target:
      entity_id: sensor.p1_meter_vermogen_fase_3
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 4000
          unit_of_measurement: W
conditions: []
actions:
  - delay: '00:00:05'
  - condition: template
    value_template: "{{ states('sensor.p1_meter_vermogen_fase_3') | float(0) > (states('input_number.p1_overload_w') | float(5000)) }}"
  - variables:
      voor_refresh: "{{ states.climate.daikinap46344_room_temperature.last_updated }}"
      overload_watt: "{{ states('sensor.p1_meter_vermogen_fase_3') | float(0) }}"
      overload_threshold: "{{ states('input_number.p1_overload_w') | float(5000) }}"
  - action: button.press
    target:
      entity_id: button.daikinap46344_refresh
    data: {}
  - wait_template: "{{ states.climate.daikinap46344_room_temperature.last_updated != voor_refresh }}"
    timeout:
      seconds: 30
    continue_on_timeout: true
  - action: climate.set_hvac_mode
    target:
      device_id: 11d4134dc902d5394e05404c2712853e
    data:
      hvac_mode: 'off'
    alias: Airco uitschakelen
  - action: notify.send_message
    target:
      entity_id: notify.samsung_s23
    data:
      message: >-
        De airco in de woonkamer is vanwege dreigende overbelasting
        uitgeschakeld.
      title: Airco woonkamer uitgeschakeld
  - action: rest_command.supabase_login
    response_variable: login
  - action: rest_command.supabase_log_overload_event
    data:
      token: "{{ login['content']['access_token'] }}"
      phase: L3
      watt: "{{ overload_watt }}"
      threshold: "{{ overload_threshold }}"
      source: airco_woonkamer
      action: uitgeschakeld
mode: single
