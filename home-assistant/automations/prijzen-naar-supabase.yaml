# VERVALLEN sinds app-versie 3.70 (1 oktober 2026) - zie
# home-assistant/automations/instellingen-uit-supabase.yaml.
#
# Deze automatisering stuurde de HA-helpers input_number.stroomprijs en
# input_number.gasprijs NAAR app_settings in Supabase (HA was de bron). Sinds
# v3.70 is de V3L-app zelf de plek waar de tarieven worden ingesteld, en
# werkt de sync de andere kant op: Supabase -> HA, via de nieuwe
# automatisering "Instellingen uit Supabase ophalen".
#
# Verwijder deze automatisering uit je eigen Home Assistant (als hij daar
# nog actief staat) en vervang hem door "Instellingen uit Supabase ophalen".
# Als je deze automatisering laat staan EN de nieuwe erbij zet, ontstaat er
# geen oneindige lus (de waarden convergeren, want beide kanten schrijven
# uiteindelijk dezelfde waarde), maar het is dubbel werk en verwarrend -
# dus gewoon verwijderen.
